<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clean files reach the trusted side; nothing else does" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1a1a1a">Clean files reach the trusted side; nothing else does</text>
  <g>
