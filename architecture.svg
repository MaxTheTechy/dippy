<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two front doors; only sanitised files reach save_blob" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="sd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="540" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1a1a1a">Two front doors; only sanitised files reach save_blob</text>

  <g>
    <rect x="40" y="165" width="680" height="150" rx="8" fill="#c0392b" fill-opacity="0.08" stroke="#c0392b" stroke-width="1.25"/>
    <text x="60" y="190" font-weight="600" fill="#1a1a1a">Quarantine zone</text>
    <text x="214" y="190" font-size="11.5" fill="#6b6b6b">isolated, no egress</text>
  </g>
  <g>
    <rect x="40" y="410" width="680" height="100" rx="8" fill="#1e8e3e" fill-opacity="0.08" stroke="#1e8e3e" stroke-width="1.25"/>
    <text x="60" y="436" font-weight="600" fill="#1a1a1a">Safe zone</text>
    <text x="250" y="436" font-size="11.5" fill="#6b6b6b">separate account, never reads quarantine</text>
  </g>

  <g fill="none" stroke="#8a8a8a" stroke-width="1.25">
    <path d="M250 78H275V96H300" marker-end="url(#sd-arrow)"/>
    <path d="M250 136H275V116H300" marker-end="url(#sd-arrow)"/>
    <path d="M490 106H540" marker-end="url(#sd-arrow)"/>
    <path d="M395 130V205H185V225" marker-end="url(#sd-arrow)"/>
    <path d="M280 255H325" marker-end="url(#sd-arrow)"/>
    <path d="M515 255H565" marker-end="url(#sd-arrow)"/>
    <path d="M640 285V392H200V443" marker-end="url(#sd-arrow)"/>
  </g>
  <path d="M315 465H430" fill="none" stroke="#6b6b6b" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#sd-arrow)"/>

  <g>
    <rect x="40" y="54" width="210" height="48" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="145" y="74" text-anchor="middle" fill="#1a1a1a">Internal analyst</text>
    <text x="145" y="91" text-anchor="middle" font-size="11.5" fill="#6b6b6b">Entra ID (SSO)</text>
  </g>
  <g>
    <rect x="40" y="112" width="210" height="48" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="145" y="132" text-anchor="middle" fill="#1a1a1a">Partner</text>
    <text x="145" y="149" text-anchor="middle" font-size="11.5" fill="#6b6b6b">link + password, 48h</text>
  </g>
  <g>
    <rect x="300" y="82" width="190" height="48" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="395" y="110" text-anchor="middle" fill="#1a1a1a">Portal + API</text>
  </g>
  <g>
    <rect x="540" y="82" width="180" height="48" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="630" y="110" text-anchor="middle" fill="#1a1a1a">State store</text>
  </g>

  <g>
    <rect x="90" y="225" width="190" height="60" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="185" y="249" text-anchor="middle" fill="#1a1a1a">Quarantine blob</text>
    <text x="185" y="269" text-anchor="middle" font-size="11.5" fill="#6b6b6b">named by upload ID</text>
  </g>
  <g>
    <rect x="325" y="225" width="190" height="60" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="420" y="249" text-anchor="middle" fill="#1a1a1a">Malware scan</text>
    <text x="420" y="269" text-anchor="middle" font-size="11.5" fill="#6b6b6b">Defender for Storage</text>
  </g>
  <g>
    <rect x="565" y="225" width="150" height="60" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="640" y="249" text-anchor="middle" fill="#1a1a1a">CDR / sanitise</text>
    <text x="640" y="269" text-anchor="middle" font-size="11.5" fill="#6b6b6b">strip active content</text>
  </g>

  <g>
    <rect x="85" y="443" width="230" height="44" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="200" y="461" text-anchor="middle" fill="#1a1a1a">Safe blob</text>
    <text x="200" y="479" text-anchor="middle" font-size="11.5" fill="#6b6b6b">save_blob</text>
  </g>
  <g>
    <rect x="430" y="443" width="230" height="44" rx="8" fill="none" stroke="#6b6b6b" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="545" y="461" text-anchor="middle" fill="#6b6b6b">Downstream process</text>
    <text x="545" y="479" text-anchor="middle" font-size="11.5" fill="#6b6b6b">(out of scope)</text>
  </g>

  <text x="402" y="152" font-size="11.5" fill="#6b6b6b">upload via SAS</text>
  <text x="214" y="386" font-size="11.5" fill="#6b6b6b">clean, sanitised only</text>
  <text x="372" y="459" text-anchor="middle" font-size="11.5" fill="#6b6b6b">out of scope</text>
</svg>
