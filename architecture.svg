  </g>
  <g>
    <rect x="270" y="60" width="210" height="48" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="375" y="88" text-anchor="middle" fill="#1a1a1a">Portal + API</text>
  </g>
  <g>
