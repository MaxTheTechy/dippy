    <text x="200" y="496" text-anchor="middle" fill="#1a1a1a">Trusted blob</text>
  </g>
  <g>
    <rect x="430" y="472" width="230" height="40" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
