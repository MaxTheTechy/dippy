    <text x="232" y="458" font-size="11.5" fill="#6b6b6b">separate account, never reads quarantine</text>
  </g>
  <g fill="none" stroke="#8a8a8a" stroke-width="1.25">
    <path d="M185 84H270" marker-end="url(#arch-arrow)"/>
    <path d="M480 84H560" marker-end="url(#arch-arrow)"/>
    <path d="M375 108V188H200V200" marker-end="url(#arch-arrow)"/>
    <path d="M315 232H430" marker-end="url(#arch-arrow)"/>
    <path d="M545 264V334" marker-end="url(#arch-arrow)"/>
    <path d="M545 390V414H200V472" marker-end="url(#arch-arrow)"/>
    <path d="M315 492H430" marker-end="url(#arch-arrow)"/>
  </g>
  <g>
