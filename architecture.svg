    <text x="200" y="226" text-anchor="middle" fill="#1a1a1a">Quarantine blob</text>
    <text x="200" y="248" text-anchor="middle" font-size="11.5" fill="#6b6b6b">named by upload ID</text>
  </g>
  <g>
    <rect x="430" y="200" width="230" height="64" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="545" y="226" text-anchor="middle" fill="#1a1a1a">Malware scan</text>
    <text x="545" y="248" text-anchor="middle" font-size="11.5" fill="#6b6b6b">Defender or custom</text>
  </g>
